[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legivel"
version = "0.1.0"
description = "Verificador de Linguagem Simples e legibilidade (Flesch adaptado) para textos em português — um 'linter' para comunicação pública, jurídica e de saúde."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["linguagem simples", "legibilidade", "flesch", "português", "acessibilidade", "plain language", "nlp", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/yagodejesus/legivel"
Issues = "https://github.com/yagodejesus/legivel/issues"

[project.scripts]
legivel = "legivel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legivel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
